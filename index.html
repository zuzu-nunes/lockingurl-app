<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="LempiraFlow">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ECF1EF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0C1311" media="(prefers-color-scheme: dark)">
<meta name="description" content="Personal finance in Honduran lempiras: budget, spending, net worth and goals.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<title>LempiraFlow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#ECF1EF; --card:#FFFFFF; --card2:#F5F8F7; --ink:#13201B; --muted:#5D6B66; --line:#DCE4E1;
  --accent:#12875A; --accent-ink:#FFFFFF; --accent-soft:#DDF1E7; --hero:#0F6E4A; --hero2:#12875A;
  --blue:#1F74C4; --danger:#C2413A; --danger-soft:#FBE6E4; --track:#E2E9E6; --warn:#B36B00; --warn-soft:#FCEFD6;
  --c1:#1F74C4; --c2:#DE4E78; --c3:#7657D2; --c4:#E2902A; --c5:#13A08F; --c6:#B99A16; --c7:#CF5A37; --c8:#8790A0;
  --shadow:0 1px 2px rgba(19,32,27,.05),0 6px 20px rgba(19,32,27,.06);
  --display:"Bricolage Grotesque",ui-rounded,"Segoe UI",system-ui,sans-serif;
  --body:"Figtree",ui-sans-serif,"Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0C1311; --card:#161F1C; --card2:#1C2723; --ink:#E7EEEB; --muted:#9AA9A3; --line:#26332E;
    --accent:#3CC287; --accent-ink:#04200F; --accent-soft:#163A2A; --hero:#0F4B34; --hero2:#167150;
    --blue:#5AA6EE; --danger:#F07A70; --danger-soft:#3A1E1C; --track:#24302C; --warn:#F2B048; --warn-soft:#3A2D14;
    --c1:#4F9BE6; --c2:#F0729A; --c3:#9C83EE; --c4:#F2A84A; --c5:#33C2AF; --c6:#D9BB3C; --c7:#EE7F5B; --c8:#9AA3B3;
    --shadow:0 1px 2px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0C1311; --card:#161F1C; --card2:#1C2723; --ink:#E7EEEB; --muted:#9AA9A3; --line:#26332E;
  --accent:#3CC287; --accent-ink:#04200F; --accent-soft:#163A2A; --hero:#0F4B34; --hero2:#167150;
  --blue:#5AA6EE; --danger:#F07A70; --danger-soft:#3A1E1C; --track:#24302C; --warn:#F2B048; --warn-soft:#3A2D14;
  --c1:#4F9BE6; --c2:#F0729A; --c3:#9C83EE; --c4:#F2A84A; --c5:#33C2AF; --c6:#D9BB3C; --c7:#EE7F5B; --c8:#9AA3B3;
  --shadow:0 1px 2px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0}
[hidden]{display:none!important}
button{-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.app{max-width:460px;margin:0 auto;padding-inline:max(16px,env(safe-area-inset-left,0px));padding-top:calc(14px + env(safe-area-inset-top,0px));padding-bottom:120px;display:flex;flex-direction:column;gap:14px}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* top */
.topbar{display:grid;grid-template-columns:40px 1fr 40px;align-items:center;gap:8px}
.round{width:40px;height:40px;border-radius:50%;border:0;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.round.plain{background:var(--card);color:var(--muted);box-shadow:var(--shadow)}
.round:disabled{opacity:.35;cursor:default}
.month{text-align:center}
.month h1{font-family:var(--display);font-weight:700;font-size:24px;margin:0;letter-spacing:-.01em;text-transform:capitalize}
.month small{color:var(--accent);font-weight:600;font-size:13px}
.title-row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.title-row h1{font-family:var(--display);font-size:26px;font-weight:700;margin:0;letter-spacing:-.01em}

.card{background:var(--card);border-radius:20px;padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px}
.card h2{font-family:var(--display);font-size:18px;font-weight:700;margin:0;letter-spacing:-.005em}
.sub{color:var(--muted);font-size:13px;margin:0}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.link{background:none;border:0;padding:0;color:var(--blue);font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px}

/* hero */
.hero{background:linear-gradient(150deg,var(--hero),var(--hero2));color:#F2FBF6;border-radius:24px;padding:18px;display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden}
.hero::after{content:"L";position:absolute;right:-6px;bottom:-46px;font-family:var(--display);font-weight:800;font-size:190px;line-height:1;color:rgba(255,255,255,.07);pointer-events:none}
.hero .label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;opacity:.85;font-weight:600}
.hero .big{font-family:var(--display);font-weight:800;font-size:38px;line-height:1.05;letter-spacing:-.02em}
.hero .usd{opacity:.8;font-size:13px}
.hero .split{display:grid;grid-template-columns:1fr 1fr;gap:10px;position:relative;z-index:1}
.hero .split div{background:rgba(255,255,255,.12);border-radius:14px;padding:10px 12px}
.hero .split span{display:block;font-size:12px;opacity:.85}
.hero .split b{font-family:var(--display);font-size:17px;font-weight:700}

.greet h1{font-family:var(--display);font-size:26px;margin:0;font-weight:700;letter-spacing:-.01em}
.greet p{margin:0;color:var(--muted);text-transform:capitalize}

.chips{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chip{background:var(--card);border-radius:16px;padding:12px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:2px}
.chip b{font-family:var(--display);font-size:22px;font-weight:700}
.chip span{font-size:12.5px;color:var(--muted)}

/* budget */
.bigline{font-family:var(--display);font-size:15px;color:var(--muted)}
.bigline b{color:var(--ink);font-size:22px;font-weight:700}
.bar{height:12px;border-radius:99px;background:var(--track);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--accent);transition:width .5s ease}
.bar.over i{background:var(--danger)}
.bar.thin{height:8px}
.legend-row{display:flex;justify-content:space-between;font-size:14px;font-weight:600}
.spent{color:var(--danger);display:inline-flex;gap:6px;align-items:center}
.budget{color:var(--blue);display:inline-flex;gap:6px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
.pill.bad{background:var(--danger-soft);color:var(--danger)}

/* donut */
.donut-wrap{display:grid;grid-template-columns:150px 1fr;gap:16px;align-items:center}
.donut{width:150px;height:150px;max-width:100%}
.donut text{font-family:var(--display)}
.legend{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px;font-size:14px;min-width:0}
.legend li{display:grid;grid-template-columns:10px 1fr auto;gap:8px;align-items:center}
.legend li span:nth-child(2){overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:10px;height:10px;border-radius:50%}
.legend .amt{color:var(--muted)}
@media (max-width:380px){.donut-wrap{grid-template-columns:1fr;justify-items:center}.legend{width:100%}}

/* list */
.list{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;padding:10px 0;border:0;border-top:1px solid var(--line);background:none;text-align:left;width:100%}
.item:first-child{border-top:0}
.badge{width:40px;height:40px;border-radius:12px;display:grid;place-items:center}
.item .t{font-weight:600;font-size:15px;line-height:1.25;overflow:hidden;text-overflow:ellipsis}
.item .s{font-size:12.5px;color:var(--muted)}
.item .a{font-family:var(--display);font-weight:700;font-size:16px;text-align:right}
.item .a.in{color:var(--accent)}
.item .a small{display:block;font-family:var(--body);font-weight:500;font-size:12px;color:var(--muted)}
.empty{color:var(--muted);text-align:center;padding:18px 8px;font-size:14px}

.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--card2);border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;background:none;padding:7px 8px;border-radius:9px;font-weight:600;font-size:13.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}

.sample{background:var(--accent-soft);color:var(--ink);border-radius:16px;padding:12px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:13.5px}
.sample button{border:0;background:var(--accent);color:var(--accent-ink);font-weight:600;border-radius:99px;padding:7px 12px;font-size:13px}

/* goals */
.goal{display:flex;flex-direction:column;gap:10px}
.goal .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.goal h3{margin:0;font-family:var(--display);font-size:17px;font-weight:700}
.goal .pct{font-family:var(--display);font-weight:800;font-size:22px;color:var(--accent)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:0;border-radius:12px;padding:10px 14px;font-weight:600;font-size:14px;background:var(--card2);color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.danger{background:var(--danger-soft);color:var(--danger)}
.btn.wide{width:100%}

/* chart */
.chart svg{width:100%;height:auto;display:block}
.chart text{font-family:var(--body);font-size:10.5px;fill:var(--muted)}
.key{display:flex;gap:14px;font-size:12.5px;color:var(--muted)}
.key span{display:inline-flex;gap:6px;align-items:center}
.key i{width:10px;height:10px;border-radius:3px;display:inline-block}
.insights{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ins{background:var(--card);box-shadow:var(--shadow);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:4px}
.ins .k{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.ins .v{font-family:var(--display);font-size:21px;font-weight:700;line-height:1.15}
.ins .d{font-size:12.5px;color:var(--muted)}
.ins.full{grid-column:1/-1}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line)}
.nav-in{max-width:460px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
.nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted);padding:6px 0;border-radius:14px}
.nav button .ic{width:23px;height:23px}
.nav button[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
.fab{position:fixed;z-index:21;right:max(16px,calc(50% - 214px));bottom:calc(84px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:18px;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 8px 22px rgba(18,135,90,.35)}
.fab .ic{width:26px;height:26px;stroke-width:2.2}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(6,14,11,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:460px;border-radius:24px 24px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:92%;overflow:auto;display:flex;flex-direction:column;gap:14px;animation:up .22s ease}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
.sheet h2{font-family:var(--display);font-size:21px;margin:0}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.field input,.field select{font-size:16px;border:1px solid var(--line);background:var(--card2);border-radius:12px;padding:11px 12px;width:100%;min-width:0}
.amount-in{font-family:var(--display);font-size:26px!important;font-weight:700}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hint{font-size:12.5px;color:var(--muted);margin:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;font-weight:600;font-size:14px;z-index:50}

/* v2: easier flows */
.bigbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bigbtn{border:0;border-radius:20px;padding:16px 10px;font-weight:700;font-size:16px;display:flex;flex-direction:column;align-items:center;gap:8px;background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.bb-ic{width:46px;height:46px;border-radius:50%;display:grid;place-items:center}
.bb-ic .ic{width:26px;height:26px;stroke-width:2.2}
.bigbtn.out .bb-ic{background:var(--danger-soft);color:var(--danger)}
.bigbtn.in .bb-ic{background:var(--accent-soft);color:var(--accent)}
.bigbtn:active{transform:scale(.98)}
.state{align-self:flex-start;font-size:13.5px;font-weight:700;padding:5px 11px;border-radius:99px;background:rgba(255,255,255,.18);position:relative;z-index:1}
.state.warn{background:#F6C453;color:#3A2A00}
.state.over{background:#FFD9D5;color:#7A1A12}
.tip{display:flex;gap:10px;align-items:flex-start;margin:0;font-size:14.5px;line-height:1.4;background:var(--accent-soft);color:var(--ink);border-radius:14px;padding:12px 14px}
.tip .ic{color:var(--accent);margin-top:1px}
.tip.big{font-size:15.5px;padding:14px 16px;border-radius:18px}
.tip.warn{background:var(--warn-soft)}.tip.warn .ic{color:var(--warn)}
.tip.bad{background:var(--danger-soft)}.tip.bad .ic{color:var(--danger)}
.cta{gap:10px}.cta .sub{font-size:14.5px}
.card.flat{box-shadow:none;border:1px solid var(--line)}
.plan-top{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.plan-top div{background:var(--card2);border-radius:14px;padding:10px 12px}
.plan-top span{display:block;font-size:12.5px;color:var(--muted);font-weight:600}
.plan-top b{font-family:var(--display);font-size:20px}
.plan-top .save b{color:var(--accent)}
.reclist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.reclist li{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;padding:7px 0;border-top:1px solid var(--line);font-weight:600}
.reclist li:first-child{border-top:0}
.reclist b{font-family:var(--display);font-size:16px}
.catrow{display:grid;grid-template-columns:40px 1fr;gap:12px;align-items:center;padding:12px 0;border:0;border-top:1px solid var(--line);background:none;text-align:left;width:100%}
.catrow:first-child{border-top:0}
.cr-body{display:flex;flex-direction:column;gap:6px;min-width:0}
.cr-top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.catrow .t{font-weight:600}
.catrow .s{font-size:12.5px;color:var(--muted)}
.cr-left{font-weight:700;font-size:14px;color:var(--accent);white-space:nowrap}
.cr-left.warn{color:var(--warn)}.cr-left.over{color:var(--danger)}
.bar.warn i{background:var(--warn)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{border:1px solid var(--line);background:var(--card2);border-radius:16px;padding:12px;display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px;text-align:left;min-height:66px;line-height:1.2}
.tile:active{transform:scale(.98)}
.picked{display:flex;gap:12px;align-items:center}
.picked h2{font-size:22px}
.qs{display:flex;flex-wrap:wrap;gap:8px}
.q{border:1px solid var(--line);background:var(--card2);border-radius:99px;padding:9px 15px;font-weight:600;font-size:15px}
.q[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.flabel{font-size:13px;font-weight:600;color:var(--muted)}
.field input[type=date]{margin-top:6px}
.more summary{cursor:pointer;color:var(--blue);font-weight:600;font-size:14.5px;padding:4px 0}
.more[open]{display:flex;flex-direction:column;gap:10px}
.btn.xl{padding:15px;font-size:17px;border-radius:16px}
.link.center{align-self:center;padding:8px}
.sh{font-family:var(--display);font-size:16px;margin:6px 0 0}
.ob{min-height:calc(100dvh - 60px);display:flex;flex-direction:column;justify-content:center;gap:16px;padding-block:20px}
.ob h1{font-family:var(--display);font-size:30px;line-height:1.1;margin:0;letter-spacing:-.015em;text-wrap:balance}
.ob .lead{margin:0;color:var(--muted);font-size:16px}
.ob-dots{display:flex;gap:6px}
.ob-dots i{width:28px;height:6px;border-radius:99px;background:var(--track)}
.ob-dots i.on{background:var(--accent)}
.ob-mark{width:64px;height:64px;border-radius:20px;background:linear-gradient(150deg,var(--hero),var(--hero2));color:#fff;display:grid;place-items:center}
.ob-mark .ic{width:32px;height:32px}
.ulist{display:flex;flex-direction:column}
.urow{display:grid;grid-template-columns:40px 1fr 118px;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line);cursor:text}
.urow:first-child{border-top:0}
.ut{display:flex;flex-direction:column;min-width:0;line-height:1.25}
.ut b{font-size:15px}
.ut small{font-size:12.5px;color:var(--muted)}
.urow input{font-size:16px;font-family:var(--display);font-weight:700;text-align:right;border:1px solid var(--line);background:var(--card2);border-radius:12px;padding:10px;width:100%;min-width:0}
.utotal{margin:0;font-size:14.5px;background:var(--card2);border-radius:12px;padding:10px 12px}
.utotal .neg{color:var(--danger)}
.stack{display:flex;flex-direction:column;gap:12px}
@media (max-width:360px){.urow{grid-template-columns:36px 1fr 96px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<main class="app" id="app" aria-live="polite"></main>
<button class="fab" id="fab" aria-label="Add money spent" hidden></button>
<nav class="nav" aria-label="Sections" hidden><div class="nav-in" id="nav"></div></nav>
<div id="sheetHost"></div>
<div class="toast" id="toast" hidden></div>

<script>
/* ---------- helpers ---------- */
const P={
  home:'M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z',
  cart:'M3 4h2l2.4 11h10.8l2-8H6.3M9 20h.01M17 20h.01',
  bus:'M6 3h12a1 1 0 0 1 1 1v12H5V4a1 1 0 0 1 1-1zM5 10h14M8 19v-3M16 19v-3M8 13.5h.01M16 13.5h.01',
  bolt:'M13 2L4 14h7l-1 8 9-12h-7z',
  bag:'M5 8h14l-1 12H6zM9 8V6a3 3 0 0 1 6 0v2',
  ticket:'M3 6h18v4a2 2 0 0 0 0 4v4H3v-4a2 2 0 0 0 0-4zM14 6v12',
  heart:'M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.5-7 10-7 10z',

// Share of spendable income per category when there is no history yet.
const DEFAULT_PAYDAY='last'; // she's paid once a month, on the last day
const DEFAULT_INCOME=25000; // her monthly pay, prefilled so setup is one tap
const SHARE={vivienda:.30,comida:.25,transporte:.12,servicios:.10,salud:.05,compras:.07,ocio:.06,otros:.05};
const NEEDS=new Set(['vivienda','comida','servicios','transporte','salud']);
const FIXED=new Set(['vivienda','servicios']);
const round50=v=>Math.round(v/50)*50;
const lower=s=>s.charAt(0).toLowerCase()+s.slice(1);
function history(txns){
  const n=new Date();const avg={};let months=0,inc=0;
  for(let k=1;k<=3;k++){
    const d=new Date(n.getFullYear(),n.getMonth()-k,1);const key=ymKey(d.getFullYear(),d.getMonth());
    const tx=txns.filter(t=>ymOf(t.date)===key);if(!tx.length)continue;months++;
    tx.forEach(t=>{if(t.type==='gasto')avg[t.cat]=(avg[t.cat]||0)+t.amt;else inc+=t.amt});
  }
  if(months)Object.keys(avg).forEach(k=>avg[k]/=months);
  return {avg,months,income:months?inc/months:0};
}
function recommend(income,txns,usual){
  const h=history(txns);
  const told=!!usual&&Object.values(usual).some(v=>v>0);
  const saveRate=income<12000?.10:income<25000?.15:.20;
  const target=income*saveRate,spend=income-target;
  const cats={},notes=[];
  const tot=()=>Object.values(cats).reduce((a,b)=>a+b,0);
  // Cut these categories evenly (each by at most maxCut of itself) until spending fits.
  const trim=(keys,maxCut,limit=spend)=>{const over=tot()-limit;if(over<=0)return;const sub=keys.reduce((a,k)=>a+cats[k],0);if(!sub)return;
    const f=Math.min(maxCut,over/sub);keys.forEach(k=>{cats[k]*=1-f})};
  const wants=Object.keys(SHARE).filter(k=>!NEEDS.has(k));
  const flex=Object.keys(SHARE).filter(k=>NEEDS.has(k)&&!FIXED.has(k));
  let stated=0;
  if(told){
    // Start from what she says she spends, then make room for savings: extras first, a little off food and transport.
    for(const k in SHARE)cats[k]=usual[k]||0;
    stated=tot();
    const buffer=round50(income*.03);
    if(cats.otros<buffer&&tot()+buffer-cats.otros<=income){notes.push(`I added ${L(buffer-cats.otros,0)} under Other for surprises, like a gift or a repair.`);cats.otros=buffer}
    trim(wants,.5);trim(flex,.1);
    trim(Object.keys(cats).filter(k=>!FIXED.has(k)),1,income); // never plan more than she gets
  }else{
    for(const k in SHARE){
      const base=spend*SHARE[k],hv=h.avg[k]||0;
      let v=h.months?(hv>0?.6*hv+.4*base:base*.5):base;
      if(FIXED.has(k)&&hv)v=hv;                 // rent and bills cost what they cost
      else if(!NEEDS.has(k))v=Math.min(v,base); // never plan more fun money than the rule allows
      cats[k]=v;
    }
    trim(wants,.5);trim(Object.keys(cats).filter(k=>!FIXED.has(k)),1);
  }
  for(const k in cats)cats[k]=Math.max(0,FIXED.has(k)?Math.ceil(cats[k]/50)*50:round50(cats[k]));
  const extra=tot()-income;
  if(extra>0){const k=Object.keys(cats).filter(x=>!FIXED.has(x)).sort((a,b)=>cats[b]-cats[a])[0];if(k)cats[k]=Math.max(0,cats[k]-extra)}
  const total=tot(),save=Math.max(0,income-total);
  const why=save>=target-50?'so you can save every month':'so it fits your pay';
  if(told){
    for(const k in SHARE)if(usual[k]&&cats[k]<usual[k]-25)notes.push(`${CATS[k].n}: you said ${L(usual[k],0)}. I set ${L(cats[k],0)} ${why}.`);
    notes.unshift(stated>income
      ?`Right now you spend about ${L(stated-income,0)} more than you get. This plan trims the extras so it fits.`
      :save>=target-50
        ?`Your spending fits your pay. You can save ${L(save,0)} a month, ${Math.round(save/income*100)}% of what you get.`
        :'This plan is built from what you told me you spend.');
  }else{
    for(const k in cats){const hv=h.avg[k]||0;
      if(!FIXED.has(k)&&hv>cats[k]*1.15&&hv-cats[k]>=200)notes.push(`You usually spend ${L(hv,0)} on ${lower(CATS[k].n)}. Spending ${L(cats[k],0)} instead saves you ${L(hv-cats[k],0)} a month.`)}
    notes.unshift(h.months
      ?`Based on what you earn and what you spent in the last ${h.months===1?'month':h.months+' months'}.`
      :'Most of your money goes to needs like rent and food, a little goes to fun, and some gets saved every month. Tell me what you really spend and I can fit it better.');
  }
  if(save<income*.05)notes.push('Your bills take almost everything you get right now, so there is little left to save. Even L 100 a week adds up.');
  return {cats,total,save,notes};
}

function homeTip(y,m){

    const score=st==='over'?2+sp/lim:st==='warn'?1+sp/lim:0;if(score&&(!worst||score>worst.score))worst={k,sp,lim,st,score}}

  const n=CATS[worst.k].n;
  if(worst.st==='over')return {cls:'bad',text:`${n}: you went ${L(worst.sp-worst.lim,0)} over. Try to skip extras here until next month.`};
  return {cls:'warn',text:`${n} is at ${Math.round(worst.sp/worst.lim*100)}% and the month is ${Math.round(prog*100)}% done. Go easy on ${lower(n)} for a few days.`};
}

function donut(entries,total){

  return `<svg class="donut" viewBox="0 0 150 150" role="img" aria-label="Spending by category">
    <circle cx="75" cy="75" r="${r}" fill="none" stroke-width="22" style="stroke:var(--track)"/>${segs}

function niceMax(v){if(v<=0)return 1000;const p=Math.pow(10,Math.floor(Math.log10(v)));const f=v/p;return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p}

  host.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',closeSheet));
  onMount&&onMount(document.getElementById('sheet'));
  if(focus){const f=host.querySelector('input:not([type=file]):not([type=date]),select');f&&f.focus()}
}
function closeSheet(){document.getElementById('sheetHost').innerHTML=''}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
const acctOpts=sel=>`<option value="">Don't track</option>`+S.accounts.map(a=>`<option value="${a.id}" ${a.id===sel?'selected':''}>${esc(a.name)}</option>`).join('');
const catOpts=(type,sel)=>Object.entries(type==='ingreso'?INC:CATS).map(([k,c])=>`<option value="${k}" ${k===sel?'selected':''}>${c.n}</option>`).join('');
function applyToAcct(t,sign){const a=S.accounts.find(x=>x.id===t.acct);if(!a)return;
  const delta=(t.type==='ingreso'?1:-1)*t.amt*sign;a.bal=r2(a.bal+(isDebt(a.kind)?-delta:delta))}
function deleteBtn(onConfirm,msg='Tap again to delete'){return b=>{let armed=false;b.addEventListener('click',()=>{if(!armed){armed=true;b.textContent=msg;return}onConfirm()})}}
const close=`<button type="button" class="link" data-close>Close</button>`;

// Two easy steps: pick what it was, then how much.
function addSheet(type,cat){
  const set=type==='ingreso'?INC:CATS;
  if(!cat){
    openSheet(`<div class="row"><h2>${type==='ingreso'?'Where did the money come from?':'What did you spend on?'}</h2>${close}</div>
      <div class="tiles">${Object.entries(set).map(([k,c])=>`<button type="button" class="tile" data-pick="${k}">${badge(c)}<span>${c.n}</span></button>`).join('')}</div>`,
    form=>form.querySelectorAll('[data-pick]').forEach(b=>b.addEventListener('click',()=>addSheet(type,b.dataset.pick))),false);
    return;
  }
  const meta=set[cat],today=todayISO(),yd=new Date();yd.setDate(yd.getDate()-1);
  const yest=iso(yd.getFullYear(),yd.getMonth(),yd.getDate());
  const quick=type==='ingreso'?[1000,2500,5000,10000]:[50,100,200,500,1000];
  const lim=type==='gasto'?catLeft(cat):null;
  const defAcct=S.lastAcct&&S.accounts.some(a=>a.id===S.lastAcct)?S.lastAcct:'';
  openSheet(`<div class="row"><button type="button" class="link" id="x-back">${icon('chevL')}Back</button>${close}</div>
    <div class="picked">${badge(meta)}<div><h2>${meta.n}</h2>${lim&&lim.limit?`<p class="sub num">${lim.spent<=lim.limit?`${L(lim.limit-lim.spent,0)} left this month`:`Already ${L(lim.spent-lim.limit,0)} over this month`}</p>`:''}</div></div>
    <div class="field"><label for="x-amt">How much? (lempiras)</label><input id="x-amt" class="amount-in num" inputmode="decimal" placeholder="L 0"></div>
    <div class="qs">${quick.map(v=>`<button type="button" class="q" data-q="${v}">${L(v,0)}</button>`).join('')}</div>
    <div class="field"><label for="x-note">What was it? (optional)</label><input id="x-note" maxlength="60" placeholder="${type==='ingreso'?'e.g. Paycheck':'e.g. Baleadas, groceries, bus'}"></div>
    <div class="field"><span class="flabel">When?</span><div class="qs" id="x-when">
      <button type="button" class="q" data-d="${today}" aria-pressed="true">Today</button><button type="button" class="q" data-d="${yest}" aria-pressed="false">Yesterday</button><button type="button" class="q" data-d="other" aria-pressed="false">Another day</button></div>
      <input id="x-date" type="date" value="${today}" max="${today}" hidden aria-label="Pick the day"></div>
    <details class="more"><summary>More options</summary>
      <div class="field"><label for="x-acct">${type==='ingreso'?'Where did it go?':'Paid with'}</label><select id="x-acct">${acctOpts(defAcct)}</select></div>
      <p class="hint">Pick an account and its balance in My Money updates by itself.</p></details>
    <p class="hint" id="x-err" hidden style="color:var(--danger)">Type how much it was, like 150.</p>
    <button class="btn primary wide xl" type="submit" id="x-save">Save</button>`,
  form=>{
    const amt=form.querySelector('#x-amt'),save=form.querySelector('#x-save'),date=form.querySelector('#x-date');
    const label=()=>{const v=parseAmt(amt.value);save.textContent=v>0?`Save ${L(v,v%1?2:0)}`:'Save'};
    amt.addEventListener('input',label);
    form.querySelector('#x-back').addEventListener('click',()=>addSheet(type));
    form.querySelectorAll('[data-q]').forEach(b=>b.addEventListener('click',()=>{amt.value=b.dataset.q;label()}));
    form.querySelectorAll('[data-d]').forEach(b=>b.addEventListener('click',()=>{
      form.querySelectorAll('[data-d]').forEach(x=>x.setAttribute('aria-pressed',x===b));
      if(b.dataset.d==='other'){date.hidden=false;date.focus()}else{date.hidden=true;date.value=b.dataset.d}}));
    form.addEventListener('submit',e=>{e.preventDefault();
      const v=parseAmt(amt.value);if(!(v>0)){form.querySelector('#x-err').hidden=false;amt.focus();return}
      const acct=form.querySelector('#x-acct').value;
      const rec={id:uid(),type,amt:v,cat,note:form.querySelector('#x-note').value.trim(),date:date.value||today,acct};
      S.txns.push(rec);applyToAcct(rec,1);S.lastAcct=acct;persist();closeSheet();render();
      if(type==='gasto'&&S.catBudgets?.[cat]){const c=catLeft(cat);
        toast(c.spent<=c.limit?`Saved! ${L(c.limit-c.spent,0)} left for ${lower(meta.n)} this month.`:`Saved. You're ${L(c.spent-c.limit,0)} over on ${lower(meta.n)} this month.`,3200)}
      else toast(type==='ingreso'?'Nice! Money in saved.':'Saved!');
    });
  });
}
function txSheet(id){
  const t=S.txns.find(x=>x.id===id);if(!t)return;
  let type=t.type;
  const today=todayISO();
  openSheet(`<div class="row"><h2>Fix this entry</h2>${close}</div>
    <div class="seg" role="group" aria-label="Type"><button type="button" data-type="gasto">Money out</button><button type="button" data-type="ingreso">Money in</button></div>
    <div class="field"><label for="f-amt">Amount (lempiras)</label><input id="f-amt" class="amount-in num" inputmode="decimal" value="${t.amt}"></div>
    <div class="field"><label for="f-note">What was it?</label><input id="f-note" maxlength="60" value="${esc(t.note||'')}"></div>
    <div class="grid2">
      <div class="field"><label for="f-cat">Category</label><select id="f-cat"></select></div>
      <div class="field"><label for="f-date">Day</label><input id="f-date" type="date" value="${t.date}" max="${today}"></div>
    </div>
    <div class="field"><label for="f-acct">Account</label><select id="f-acct">${acctOpts(t.acct)}</select></div>
    <p class="hint" id="f-err" hidden style="color:var(--danger)">Type an amount bigger than zero, like 350.</p>
    <button class="btn primary wide xl" type="submit">Save changes</button>
    <button type="button" class="btn danger wide" id="f-del">Delete it</button>`,
  form=>{
    const segB=form.querySelectorAll('[data-type]'),cat=form.querySelector('#f-cat');
    const syncSeg=()=>{segB.forEach(b=>b.setAttribute('aria-pressed',b.dataset.type===type));cat.innerHTML=catOpts(type,t.type===type?t.cat:'')};
    segB.forEach(b=>b.addEventListener('click',()=>{type=b.dataset.type;syncSeg()}));syncSeg();
    deleteBtn(()=>{applyToAcct(t,-1);S.txns=S.txns.filter(x=>x.id!==t.id);persist();closeSheet();render();toast('Deleted')})(form.querySelector('#f-del'));
    form.addEventListener('submit',e=>{e.preventDefault();
      const amt=parseAmt(form.querySelector('#f-amt').value);
      if(!(amt>0)){form.querySelector('#f-err').hidden=false;return}
      const date=form.querySelector('#f-date').value||today;
      applyToAcct(t,-1);Object.assign(t,{type,amt,cat:cat.value,note:form.querySelector('#f-note').value.trim(),date,acct:form.querySelector('#f-acct').value});applyToAcct(t,1);
      persist();closeSheet();render();toast('Changes saved');
    });
  },false);
}
function helperSheet(){
  const est=S.income||Math.round(history(S.txns).income)||DEFAULT_INCOME;
  openSheet(`<div class="row"><h2>Fit my budget</h2>${close}</div>
    <div id="h-ask" class="stack">
      <p class="sub">Tell me what you get and what you usually spend. I'll make a budget that fits your real life.</p>
      <div class="field"><label for="h-inc">Money in per month (lempiras)</label><input id="h-inc" class="amount-in num" inputmode="decimal" placeholder="L 0" value="${est}"></div>
      <h3 class="sh">What you usually spend each month</h3>
      ${usualFields(usualPrefill())}
    </div>
    <p class="hint" id="h-err" hidden style="color:var(--danger)">Type how much you get each month, like 25000.</p>
    <div id="h-out"></div>
    <button class="btn primary wide xl" type="submit" id="h-go">Make my budget</button>
    <button type="button" class="link center" id="h-edit" hidden>Change my answers</button>`,
  form=>{
    const inc=form.querySelector('#h-inc'),ask=form.querySelector('#h-ask'),out=form.querySelector('#h-out'),btn=form.querySelector('#h-go'),edit=form.querySelector('#h-edit');
    let rec=null,income=0,usual={};
    wireUsual(form,()=>parseAmt(inc.value));
    edit.addEventListener('click',()=>{rec=null;out.innerHTML='';ask.hidden=false;edit.hidden=true;btn.textContent='Make my budget'});
    form.addEventListener('submit',e=>{e.preventDefault();
      if(rec){applyPlan(rec,income,usual);persist();closeSheet();go_('presupuesto');toast('Your new budget is ready.');return}
      income=parseAmt(inc.value);if(!(income>0)){form.querySelector('#h-err').hidden=false;return}
      form.querySelector('#h-err').hidden=true;usual=readUsual(form);
      rec=recommend(income,S.txns,usual);
      out.innerHTML=`<section class="card flat">${recPlan(rec)}</section>`;ask.hidden=true;edit.hidden=false;btn.textContent='Use this budget';
      document.activeElement&&document.activeElement.blur();form.scrollTop=0;
    });
  },false);
}
const go_=v=>go(v);
function catSheet(k){
  const cur=S.catBudgets?.[k]||0,rec=S.income?recommend(S.income,S.txns).cats[k]:null;
  openSheet(`<div class="row"><h2>${CATS[k].n}</h2>${close}</div>
    <div class="field"><label for="c-amt">Monthly limit (lempiras)</label><input id="c-amt" class="amount-in num" inputmode="decimal" value="${cur||''}" placeholder="L 0"></div>
    ${rec!=null?`<p class="hint num">Recommended for you: <b>${L(rec,0)}</b> <button type="button" class="link" id="c-rec">Use it</button></p>`:''}
    <button class="btn primary wide xl" type="submit">Save</button>`,
  form=>{
    const a=form.querySelector('#c-amt');const r=form.querySelector('#c-rec');if(r)r.addEventListener('click',()=>{a.value=rec});
    form.addEventListener('submit',e=>{e.preventDefault();const v=parseAmt(a.value);
      S.catBudgets={...(S.catBudgets||{}),[k]:v};S.budget=Object.values(S.catBudgets).reduce((x,y)=>x+y,0);
      if(S.income)S.saveTarget=Math.max(0,S.income-S.budget);
      persist();closeSheet();render();toast('Limit saved')});
  });
}
function acctSheet(id,kind){
  const a=id?S.accounts.find(x=>x.id===id):null;
  const k=a?.kind||kind||'efectivo';
  openSheet(`<div class="row"><h2>${a?'Update account':kind==='tarjeta'?'Add a debt':'Add an account'}</h2>${close}</div>
    <div class="field"><label for="a-name">Name</label><input id="a-name" maxlength="40" placeholder="${isDebt(k)?'e.g. Credit card':'e.g. Savings account'}" value="${esc(a?.name||'')}"></div>
    <div class="field"><label for="a-kind">Type</label><select id="a-kind">${Object.entries(KINDS).map(([kk,v])=>`<option value="${kk}" ${k===kk?'selected':''}>${v.n}</option>`).join('')}</select></div>
    <div class="field"><label for="a-bal" id="a-bal-l">${isDebt(k)?'How much do you owe? (lempiras)':'How much is in it now? (lempiras)'}</label><input id="a-bal" class="amount-in num" inputmode="decimal" value="${a?a.bal:''}" placeholder="L 0"></div>
    <button class="btn primary wide xl" type="submit">Save</button>
    ${a?'<button type="button" class="btn danger wide" id="a-del">Delete account</button>':''}`,
  form=>{
    const del=form.querySelector('#a-del'),kindSel=form.querySelector('#a-kind');
    kindSel.addEventListener('change',()=>{form.querySelector('#a-bal-l').textContent=isDebt(kindSel.value)?'How much do you owe? (lempiras)':'How much is in it now? (lempiras)'});
    if(del)deleteBtn(()=>{S.accounts=S.accounts.filter(x=>x.id!==a.id);S.txns.forEach(t=>{if(t.acct===a.id)t.acct=''});persist();closeSheet();render();toast('Account deleted')})(del);
    form.addEventListener('submit',e=>{e.preventDefault();
      const rec={name:form.querySelector('#a-name').value.trim()||KINDS[kindSel.value].n,kind:kindSel.value,bal:r2(parseFloat(form.querySelector('#a-bal').value.replace(/[^\d.-]/g,''))||0)};
      if(a)Object.assign(a,rec);else S.accounts.push({id:uid(),...rec});
      persist();closeSheet();render();toast('Saved')});
  });
}
function goalSheet(id){
  const g=id?S.goals.find(x=>x.id===id):null;
  openSheet(`<div class="row"><h2>${g?'Edit goal':'New goal'}</h2>${close}</div>
    <div class="field"><label for="g-name">What are you saving for?</label><input id="g-name" maxlength="50" placeholder="e.g. Emergency fund" value="${esc(g?.name||'')}"></div>
    <div class="grid2"><div class="field"><label for="g-target">How much you need (L)</label><input id="g-target" class="num" inputmode="decimal" value="${g?g.target:''}" placeholder="20000"></div>
    <div class="field"><label for="g-saved">Saved so far (L)</label><input id="g-saved" class="num" inputmode="decimal" value="${g?g.saved:''}" placeholder="0"></div></div>
    <div class="field"><label for="g-due">By when? (optional)</label><input id="g-due" type="date" value="${g?.due||''}"></div>
    <p class="hint" id="g-err" hidden style="color:var(--danger)">Type how much you need in total, like 20000.</p>
    <button class="btn primary wide xl" type="submit">Save</button>
    ${g?'<button type="button" class="btn danger wide" id="g-del">Delete goal</button>':''}`,
  form=>{
    const del=form.querySelector('#g-del');
    if(del)deleteBtn(()=>{S.goals=S.goals.filter(x=>x.id!==g.id);persist();closeSheet();render();toast('Goal deleted')})(del);
    form.addEventListener('submit',e=>{e.preventDefault();
      const target=parseAmt(form.querySelector('#g-target').value);
      if(!(target>0)){form.querySelector('#g-err').hidden=false;return}
      const rec={name:form.querySelector('#g-name').value.trim()||'My goal',target,saved:parseAmt(form.querySelector('#g-saved').value),due:form.querySelector('#g-due').value};
      if(g)Object.assign(g,rec);else S.goals.push({id:uid(),...rec});
      persist();closeSheet();render();toast('Goal saved')});
  });
}
function abonoSheet(id){
  const g=S.goals.find(x=>x.id===id);if(!g)return;
  openSheet(`<div class="row"><h2>Add money to “${esc(g.name)}”</h2>${close}</div>
    <div class="field"><label for="b-amt">How much? (lempiras)</label><input id="b-amt" class="amount-in num" inputmode="decimal" placeholder="L 0"></div>
    <div class="qs">${[500,1000,2000,5000].map(v=>`<button type="button" class="q" data-q="${v}">${L(v,0)}</button>`).join('')}</div>
    <button class="btn primary wide xl" type="submit">Add money</button>`,
  form=>{
    form.querySelectorAll('[data-q]').forEach(b=>b.addEventListener('click',()=>{form.querySelector('#b-amt').value=b.dataset.q}));
    form.addEventListener('submit',e=>{e.preventDefault();const v=parseAmt(form.querySelector('#b-amt').value);if(!(v>0))return;
      g.saved=r2(g.saved+v);persist();closeSheet();render();toast(`Added ${L(v,0)}. Great job!`)});
  });
}
function settingsSheet(){
  openSheet(`<div class="row"><h2>Settings</h2>${close}</div>
    <div class="field"><label for="s-name">Your name</label><input id="s-name" maxlength="30" value="${esc(S.name)}" placeholder="For the greeting"></div>
    <div class="grid2"><div class="field"><label for="s-inc">Money in per month (L)</label><input id="s-inc" class="num" inputmode="decimal" value="${S.income||''}"></div>
    <div class="field"><label for="s-rate">Lempiras per dollar</label><input id="s-rate" class="num" inputmode="decimal" value="${S.rate}"></div></div>
    <div class="field"><label for="s-pay">When do you get paid?</label>${paydaySelect('s-pay')}</div>
    <button class="btn primary wide xl" type="submit">Save</button>
    <h3 class="sh">Keep your data safe</h3>
    <p class="hint">Everything is saved on this phone only. Tap <b>Save a backup</b> once a month and keep the file in iCloud Drive or send it to yourself.</p>
    <div class="grid2"><button type="button" class="btn" id="s-export">Save a backup</button><label class="btn" for="s-import" style="text-align:center">Restore a backup</label></div>
    <input type="file" id="s-import" accept="application/json,.json" hidden>
    <p class="hint" id="s-msg" hidden></p>
    <h3 class="sh">Start over</h3>
    <button type="button" class="btn wide" id="s-sample">Show example money</button>
    <button type="button" class="btn danger wide" id="s-clear">Erase everything</button>`,
  form=>{
    form.querySelector('#s-export').addEventListener('click',exportBackup);
    form.querySelector('#s-import').addEventListener('change',e=>importBackup(e.target.files[0],form.querySelector('#s-msg')));
    deleteBtn(()=>{S=blankState(S);ui.ob=1;ui.obIncome=0;persist();closeSheet();render()},'Tap again to erase everything')(form.querySelector('#s-clear'));
    deleteBtn(()=>{const name=S.name;S=makeSample();S.name=name;persist();closeSheet();render();toast('Showing example money')},'Tap again: this replaces your data')(form.querySelector('#s-sample'));
    form.addEventListener('submit',e=>{e.preventDefault();
      S.name=form.querySelector('#s-name').value.trim();
      const i=parseAmt(form.querySelector('#s-inc').value);if(i>0){S.income=i;if(S.catBudgets)S.saveTarget=Math.max(0,i-S.budget)}
      S.payday=form.querySelector('#s-pay').value;
      const r=parseFloat(form.querySelector('#s-rate').value.replace(/[^\d.]/g,''));if(r>0)S.rate=r;
      persist();closeSheet();render();toast('Settings saved')});
  },false);
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const el=e.target.closest('button');if(!el||el.closest('#sheetHost'))return;
  const d=el.dataset;
  if(d.go)return go(d.go);
  if(d.add)return addSheet(d.add);
  if(d.edit)return txSheet(d.edit);
  if(d.acct)return acctSheet(d.acct);
  if(d.cat)return catSheet(d.cat);
  if(d.goal)return goalSheet(d.goal);
  if(d.abono)return abonoSheet(d.abono);
  if(d.filter){ui.filter=d.filter;return render()}
  if(el.id==='fab')return addSheet('gasto');
  switch(d.act){
    case 'prev':return shiftMonth(-1);
    case 'next':return shiftMonth(1);
    case 'settings':return settingsSheet();
    case 'helper':return helperSheet();
    case 'newacct':return acctSheet(null,'efectivo');
    case 'newdebt':return acctSheet(null,'tarjeta');
    case 'newgoal':return goalSheet();
    case 'ob-back':{const f=document.getElementById('ob');if(ui.ob===3&&f)ui.obUsual=readUsual(f);ui.ob=Math.max(1,ui.ob-1);return render()}
    case 'ob-skip':ui.obUsual={};ui.ob=4;render();window.scrollTo(0,0);return;
    case 'sample':{const name=S.name;S=makeSample();S.name=name;persist();ui.view='inicio';render();toast('This is example money. Tap "Start my own" when you\'re ready.',3500);return}
    case 'clear':
      if(el.dataset.armed){S=blankState(S);ui.ob=1;ui.obIncome=0;persist();ui.view='inicio';render()}
      else{el.dataset.armed='1';el.textContent='Tap again to remove the example'}
      return;
  }
});
async function exportBackup(){
  const name=`lempiraflow-backup-${todayISO()}.json`;
  const file=new File([JSON.stringify(S,null,1)],name,{type:'application/json'});
  try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'LempiraFlow backup'});return}}catch(e){if(e.name==='AbortError')return}
  const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
}
function importBackup(file,msg){
  if(!file)return;
  const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(!d||!Array.isArray(d.txns)||!Array.isArray(d.accounts))throw 0;
      S=d;if(S.onboarded===undefined)S.onboarded=true;persist();closeSheet();render();toast('Backup restored')}
    catch(e){msg.hidden=false;msg.style.color='var(--danger)';msg.textContent='That file is not a LempiraFlow backup. Pick a file you saved from this app.'}};
  r.readAsText(file);
}
render();
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
